[package]
name = "encrypted-serial"
edition.workspace = true
rust-version.workspace = true

# This crate depends on openhcl_serial_console_crypto, which is gated
# to Linux because of the workspace's openssl_kdf dependency. Mirror
# that here so the workspace builds on Windows / macOS without trying
# to compile the CLI's transitive openssl-only deps.
[dependencies]
build_info.workspace = true
openhcl_attestation_protocol.workspace = true
openhcl_serial_console_crypto.workspace = true
term.workspace = true
tpm_protocol.workspace = true

disk_backend.workspace = true
disk_vhd1.workspace = true
futures.workspace = true
getrandom.workspace = true
mesh.workspace = true
pal_async.workspace = true
vmgs.workspace = true
vmgs_format.workspace = true
zerocopy.workspace = true

anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
fs-err.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
disklayer_ram.workspace = true
tempfile.workspace = true

[build-dependencies]
build_rs_git_info.workspace = true

[lints]
workspace = true

[package.metadata.xtask.house-rules]
allow-dash-in-name = true # emits a binary, where kebab-case is more natural
